<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="palindromeChecker.css" />
</head>

<body>
    <main class="container">
        <h1 class="title">Is it a Palindrome?</h1>

        <div class="card">
            <label for="text-input" class="label">Enter in text to check for a palindrome:</label>
            <div class="input-group">
                <input type="text" id="text-input" class="text-input" />
                <button id="check-btn" class="check-btn">Check</button>
            </div>
            <div id="result" class="result"></div>
        </div>

        <div class="definition-box">
            <p>
                💡 A <em>palindrome</em> is a word or sentence that's spelled the same way both forward and backward,
                ignoring punctuation, case, and spacing.
            </p>
        </div>
    </main>

    <script src="palindromeChecker.js"></script>
</body>

</html>
