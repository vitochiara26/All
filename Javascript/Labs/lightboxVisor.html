<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Gallery - Lightbox Viewer</title>
    <link rel="stylesheet" href="lightboxVisor.css">
</head>

<body>
    <header class="gallery-header">
        <h1>Museum Gallery</h1>
    </header>

    <main>
        <div class="gallery">
            <img 
                class="gallery-item"
                src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg"
                alt="Stonehenge"
            >
            <img 
                class="gallery-item"
                src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg"
                alt="Trees Landscape"
            >
            <img 
                class="gallery-item"
                src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg"
                alt="Stormy Mountain"
            >
        </div>
    </main>

    <div class="lightbox">
        <button id="close-btn">&times;</button>
        <img id="lightbox-image" src="" alt="Vista ampliada">
    </div>

    <script src="lightboxVisor.js"></script>
</body>
</html>
