<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 13</title>
    <link rel="stylesheet" href="d13_user_gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="d13_user_gallery.js" defer></script>
</head>

<body>
    <div class="frame">
        <div id="profile-1" class="profile">
            <img src="https://100dayscss.com/codepen/13-1.jpg" alt="Profile 1">
