<style>
    :root {
        --main-color: #3498db;
    }

    @property --main-color {
        syntax: '<color>';
        inherits: false;
        initial-value: #3498db;
    }

    .button {
        background-color: var(--main-color);
    }

    @property --gradient-angle {
        syntax: '<angle>';
        inherits: false;
        initial-value: 0deg;
    }

    .gradient-box {
        width: 100px;
        height: 100px;
        background: linear-gradient(var(--gradient-angle), red, blue);
        transition: --gradient-angle 0.8s;
    }

    .gradient-box:hover {
        --gradient-angle: 90deg;
    }

    @property --main-color {
        syntax: '<color>';
        inherits: false;
        initial-value: #3498db;
    }

    body {
        background-color: var(--main-color);
    }
</style>

<button class="button">Click Me</button>

<div class="gradient-box"></div>
